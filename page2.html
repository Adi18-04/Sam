<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Things I love 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="progress">💗 💗 🤍 🤍 🤍</div>
    <h1>Things I adore about you 💖</h1>
    <p class="sub">Tap each one, Teddy has a lot of feelings about it</p>

    <div class="bubble">Pick one, <span class="her-name"></span>! 🥰</div>
    <div class="bear-wrap"></div>

    <div class="btn-row">
      <a class="btn soft" href="index.html" data-mood="happy" data-say="Going back! ⬅️" data-hover="Want to start over?">⬅ Back</a>
      <button class="btn" data-mood="love" data-say="Your smile makes my whole day better 😊💗" data-hover="That smile... 😍" data-anim="boing" data-stay="1">Your smile 😊</button>
      <button class="btn" data-mood="excited" data-say="Your curly hair 🌀 every bouncy curl is like a tiny spring... I could stare at it all day!" data-hover="Boing boing, those curls! 🌀" data-anim="spin" data-stay="1">Curly hair 🌀</button>
      <button class="btn" data-mood="shy" data-say="The way you blush turns your cheeks into little pink strawberries 🍓🥰" data-hover="Look at those rosy cheeks... 🍓" data-anim="wiggle" data-stay="1">Your blush 🍓</button>
      <button class="btn" data-mood="shy" data-say="Your innocence is so pure, it makes the whole world feel softer 🥺🤍" data-hover="So pure... 🥺" data-anim="boing" data-stay="1">Innocence 🥺</button>
      <button class="btn" data-mood="excited" data-say="Your laugh is my favourite sound in the world 😂💕" data-hover="Hehehe! 😆" data-anim="wiggle" data-stay="1">Your laugh 😂</button>
      <a class="btn" href="game.html" data-mood="surprised" data-say="Wait, there's a little game first! 🎮" data-hover="Ready to play a game? 🎮">Next 🎮</a>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="bear.js"></script>
</body>
</html>
