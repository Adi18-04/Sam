<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi SAM 🧸🎀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-start-wave="1">
  <main>
    <div class="progress">💗 🤍 🤍 🤍 🤍</div>
    <h1>Hi <span class="her-name"></span>🧸🎀</h1>
    <p class="sub">I made a little something just for you...</p>

    <div class="bubble">Hi hi! Hover over the buttons, I'm watching! (You can also poke me 👀)</div>
    <div class="bear-wrap"></div>

    <div class="btn-row">
      <button class="btn soft" data-mood="happy" data-say="Hiiii! 👋 So nice to meet you!" data-hover="Say hi to me! 👋" data-wave="1" data-stay="1">Say hi 👋</button>
      <button class="btn soft" data-mood="surprised" data-say="It's a surprise... keep going 🤫" data-hover="Ooh, curious? 👀" data-anim="boing" data-stay="1">What's this? 🤔</button>
      <a class="btn" href="page2.html" data-mood="love" data-say="Yay, let's go! 💕" data-hover="Come with me! 💌">Next 💌</a>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="bear.js"></script>
</body>
</html>
